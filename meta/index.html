<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
    <title>Meta | Diego Menchaca</title>
</head>

<script type="module" src="../global.js"></script>

<body>
    <h1>Meta</h1>
    <p>This page analyzes the codebase behind this portfolio site, showing statistics about the lines of code, files, and commits that make it up.</p>

    <div id="commit-slider">
      <label>
        Show commits until:
        <input type="range" id="commit-progress" min="0" max="100" value="100">
        <time id="commit-max-time"></time>
      </label>
    </div>

    <div id="scrolly-1">
      <div id="scatter-story">
        some filler text here
      </div>
      <div id="scatter-plot">
        <div id="stats"></div>

        <h2>Commits by time of day</h2>
        <div id="chart"></div>

        <dl id="commit-tooltip" class="info tooltip" hidden>
            <dt>Commit</dt>
            <dd><a href="" id="commit-link" target="_blank"></a></dd>
            <dt>Date</dt>
            <dd id="commit-date"></dd>
            <dt>Time</dt>
            <dd id="commit-time"></dd>
            <dt>Author</dt>
            <dd id="commit-author"></dd>
            <dt>Lines edited</dt>
            <dd id="commit-lines"></dd>
        </dl>

        <p id="selection-count">No commits selected</p>

        <h3>Language breakdown</h3>
        <dl id="language-breakdown" class="stats"></dl>

        <dl id="files"></dl>
      </div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
